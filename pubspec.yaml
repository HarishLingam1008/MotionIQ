name: motioniq
description: "MotionIQ - Track Your Health Every Step. Production-ready fitness tracking app built with Flutter, Firebase Auth, and Riverpod."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.0.1

  # Navigation & State Management
  go_router: ^14.0.0
  flutter_riverpod: ^2.5.1

  # UI & Styling
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  percent_indicator: ^4.2.3
  fl_chart: ^0.68.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
